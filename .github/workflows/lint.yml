name: Lint shell scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          bash -n deploy/install.sh
          bash -n scripts/build.sh
      - name: shellcheck
        run: shellcheck --version && shellcheck -S warning -x deploy/install.sh scripts/build.sh
